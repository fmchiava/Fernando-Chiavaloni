name: Python QA Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar runner de testes
        run: python -m pip install -r requirements-test.txt
      - name: Executar testes RPA e laboratório
        run: python -m pytest -q
      - name: Verificar integridade das evidências sintéticas
        run: |
          python cases/rpa-conciliacao-sinistros/analyze_logs.py cases/rpa-conciliacao-sinistros/examples/go
          python cases/rpa-conciliacao-sinistros/analyze_logs.py cases/rpa-conciliacao-sinistros/examples/no-go
          python cases/rpa-conciliacao-sinistros/analyze_logs.py cases/rpa-conciliacao-sinistros/examples/unverified
