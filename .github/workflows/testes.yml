name: Testes do laboratorio

on:
  push:
  pull_request:

jobs:
  importar-chamados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes
        run: python -m unittest discover -s laboratorio/importacao_chamados -p 'test_*.py' -v
